spring:
  application:
    name: ${APP_NAME:multiplayer-game}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:game}
    username: ${POSTGRES_USER:game}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:game}
    password: ${RABBITMQ_PASSWORD:change-me}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

app:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:multiplayer-game}
      audience: ${JWT_AUDIENCE:titancore-game-client}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      access-token-ttl: 10m
      clock-skew: 30s
    refresh:
      ttl: 14d
      token-bytes: 48
    cookie:
      name: refresh_token
      path: /api/auth
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Lax
    rate-limit:
      key-secret: ${AUTH_RATE_LIMIT_KEY_SECRET:local-rate-limit-key-change-me}
      login-ip-limit: ${AUTH_LOGIN_IP_LIMIT:20}
      login-identity-limit: ${AUTH_LOGIN_IDENTITY_LIMIT:10}
      register-ip-limit: ${AUTH_REGISTER_IP_LIMIT:10}
      refresh-limit: ${AUTH_REFRESH_LIMIT:60}
      window: ${AUTH_RATE_LIMIT_WINDOW:15m}
      fail-closed: ${AUTH_RATE_LIMIT_FAIL_CLOSED:false}
      login-history-key-secret: ${AUTH_LOGIN_HISTORY_KEY_SECRET:local-login-history-key-change-me}
    trusted-proxy:
      enabled: ${TRUSTED_PROXY_ENABLED:false}
      allowed-proxies: ${TRUSTED_PROXY_ALLOWED_PROXIES:}
    oauth:
      success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:http://localhost:5173/app}
      failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI:http://localhost:5173/login}
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.game: INFO
    org.springframework.security: INFO

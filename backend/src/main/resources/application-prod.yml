spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

app:
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}

logging:
  level:
    root: WARN
    com.game: INFO

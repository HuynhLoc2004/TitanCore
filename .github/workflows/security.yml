name: Security

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache OWASP Dependency Check Data
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-12.2.2-${{ hashFiles('backend/build.gradle', 'backend/settings.gradle', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-12.2.2-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "NVD_API_KEY is not configured for the OWASP Dependency Check step."
            exit 1
          fi

          echo "NVD_API_KEY is configured for this step."
          echo "Updating OWASP Dependency Check database..."
          set +e
          timeout 25m ./gradlew dependencyCheckUpdate --no-daemon
          update_exit_code=$?
          set -e
          if [ "$update_exit_code" -eq 124 ]; then
            echo "OWASP Dependency Check database update timed out after 25 minutes."
            exit 124
          elif [ "$update_exit_code" -ne 0 ]; then
            exit "$update_exit_code"
          fi

          echo "Analyzing dependencies with OWASP Dependency Check..."
          set +e
          timeout 25m ./gradlew dependencyCheckAnalyze --no-daemon
          analyze_exit_code=$?
          set -e
          if [ "$analyze_exit_code" -eq 124 ]; then
            echo "OWASP Dependency Check analysis timed out after 25 minutes."
            exit 124
          elif [ "$analyze_exit_code" -ne 0 ]; then
            exit "$analyze_exit_code"
          fi

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check-report.*

  secret-scan:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan For Common Secret Patterns
        shell: bash
        run: scripts/security/secret-scan.sh .
